name: design-tokens

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Pack dry-run
        run: npm run pack:dry
