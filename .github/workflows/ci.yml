name: design-tokens

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Test nested runtime loading
        run: npm test
      - name: Build and test installed production tarball
        run: npm run test:package
